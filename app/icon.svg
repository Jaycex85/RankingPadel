<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

 <defs>
 <linearGradient id="ballGradient" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#D7FF33"/>
 <stop offset="100%" stop-color="#C7F000"/>
 </linearGradient>

 <filter id="shadow">
 <feDropShadow dx="0" dy="6" stdDeviation="8"
 flood-color="#000000"
 flood-opacity="0.25"/>
 </filter>
 </defs>

 <!-- Fond -->
 <rect width="512"
 height="512"
 rx="110"
 fill="#0B1220"/>

 <!-- Balle -->
 <circle cx="256"
 cy="256"
 r="150"
 fill="url(#ballGradient)"
 filter="url(#shadow)"/>

 <!-- Reflet -->
 <ellipse cx="210"
 cy="190"
 rx="55"
 ry="35"
 fill="#ffffff"
 opacity="0.12"/>

 <!-- Barres de classement -->
 <g fill="#0B1220">

 <rect x="178"
 y="255"
 width="42"
 height="75"
 rx="12"/>

 <rect x="235"
 y="205"
 width="42"
 height="125"
 rx="12"/>

 <rect x="292"
 y="150"
 width="42"
 height="180"
 rx="12"/>

 </g>

</svg>
